<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevRealm · 游戏开发者服务平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1428;--app:#10131d;--panel:var(--box2);--panel2:var(--box3);--panel3:#232b3d;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#f5f7ff;--sub:#a5b0c8;--sub2:#6b7690;
  --sidebar:var(--sidebar);--box:var(--box);--box2:var(--box2);--box3:var(--box3);--input:var(--input);--input2:var(--input2);--rail:var(--rail);--chip:var(--chip);
  --btn-bg:var(--btn-bg);--hover:var(--btn-bg);--on:var(--box3);--row-line:var(--btn-bg);--on-text:var(--on-text);--body2:var(--body2);--code:var(--code);
  --purple:#8b5cf6;--purple2:#6d28d9;--green:#34d399;--red:#fb7185;--yellow:#fbbf24;--blue:#60a5fa;
  --radius:22px;--shadow:0 30px 80px -38px rgba(0,0,0,.85)
}
[data-theme="light"]{
  --bg:#eef0f8;--app:#f6f7fc;--panel:#ffffff;--panel2:#f3f5fb;--panel3:#e9edf6;
  --line:rgba(15,23,42,.10);--line2:rgba(15,23,42,.16);
  --text:#172033;--sub:#46526b;--sub2:#7a869f;
  --sidebar:#ffffff;--box:#ffffff;--box2:#f3f5fb;--box3:#e9edf6;--input:#f1f3fa;--input2:#f1f3fa;--rail:#f7f8fc;--chip:#e9edf6;
  --btn-bg:rgba(15,23,42,.05);--hover:rgba(15,23,42,.05);--on:#ede9fe;--row-line:rgba(15,23,42,.07);--on-text:#1e1b4b;--body2:#33405a;--code:#0e7490;
  --shadow:0 30px 80px -38px rgba(30,27,75,.25)
}
[data-theme="light"] body{background:
  radial-gradient(1100px 620px at 78% -10%,rgba(139,92,246,.12),transparent 60%),
  radial-gradient(760px 460px at 8% 100%,rgba(139,92,246,.06),transparent 55%),var(--bg);}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(15,23,42,.18)}
html,body{height:100%}
body{font-family:"Noto Sans SC","PingFang SC",system-ui,-apple-system,sans-serif;background:
  radial-gradient(1100px 620px at 78% -10%,rgba(109,40,217,.30),transparent 60%),
  radial-gradient(760px 460px at 8% 100%,rgba(139,92,246,.10),transparent 55%),var(--bg);
  color:var(--text);overflow:hidden;padding:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;flex:0 0 auto}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.app{height:calc(100vh - 36px);display:grid;grid-template-columns:262px minmax(0,1fr) 320px;background:var(--app);border:1px solid rgba(167,139,250,.22);border-radius:28px;overflow:hidden;box-shadow:0 0 0 3px rgba(139,92,246,.12),0 0 70px rgba(109,40,217,.18),var(--shadow)}
body.without-rail{grid-template-columns:262px minmax(0,1fr)}

/* sidebar */
.sidebar{border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;background:var(--sidebar)}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 20px}
.brand .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),#4f46e5);box-shadow:0 12px 28px -14px rgba(139,92,246,.8)}
.brand .mark svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2}
.brand b{font-size:19px;letter-spacing:.03em}
.brand small{display:block;font-size:9px;letter-spacing:.22em;color:var(--sub2);margin-top:3px}
.nav{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;gap:3px;overflow:auto}
.nav .group{font-size:10px;letter-spacing:.18em;color:var(--sub2);padding:18px 10px 7px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--sub);font-size:13px;padding:10px 10px;border-radius:11px;text-align:left;transition:.18s}
.nav button .ico{width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto}
.nav button .ico svg{width:18px;height:18px}
.nav button:hover{background:var(--btn-bg);color:var(--on-text)}
.nav button.on{background:var(--on);color:var(--text);border:1px solid rgba(139,92,246,.35);box-shadow:inset 0 0 0 1px rgba(139,92,246,.06)}
.nav button.on .ico{color:#c4b5fd}
.side-stats{flex:0 0 auto;padding:0 2px 14px}
.stat-card{background:var(--box);border:1px solid var(--line);border-radius:18px;padding:16px 13px;display:grid;grid-template-columns:1fr 1fr;gap:18px 10px}
.side-stat{display:flex;gap:10px;align-items:center}.stat-card{background:var(--box2)}
.side-stat i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;background:rgba(139,92,246,.12);color:#c4b5fd}
.side-stat i svg{width:15px;height:15px}
.side-stat b{display:block;font-size:15px;line-height:1.1}.side-stat span{font-size:9.5px;color:var(--sub2)}
.side-idea{flex:0 0 auto;background:transparent;border:0;border-radius:16px;padding:0;margin:0 2px 14px}
.idea-label{font-size:11px;color:var(--sub);margin:0 0 10px}
.side-idea .idea-card{background:var(--box);border:1px solid var(--line);border-radius:16px;padding:14px}
.idea-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.idea-head b{font-size:12px;color:var(--sub)}.idea-head button{border:0;background:transparent;color:var(--sub2)}
.side-idea p{font-size:12px;line-height:1.9;color:var(--body2)}
.side-idea em{font-style:normal;color:#93c5fd}.side-idea i{font-style:normal;color:#fda4af}.side-idea strong{color:#c4b5fd}
.profile{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#312e81,#7c3aed);display:grid;place-items:center;font-weight:700;color:#fff;flex:0 0 auto}
.profile b{display:block;font-size:13px}.profile span{font-size:10px;color:var(--sub2);letter-spacing:.08em}
.profile .logout{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 9px;color:var(--sub);font-size:11px}

/* shell/topbar */
.shell{min-width:0;display:flex;flex-direction:column}
.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 26px;background:transparent}
.crumb{display:none}
.search{flex:1;max-width:390px;display:flex;align-items:center;gap:9px;background:var(--input);border:1px solid var(--line);border-radius:13px;padding:11px 14px}
.search svg{width:16px;height:16px;stroke:var(--sub2);fill:none;stroke-width:2}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:13px;color:var(--text)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--btn-bg);border-radius:12px;display:grid;place-items:center;color:var(--sub)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.menu-btn{display:none;border:1px solid var(--line);background:var(--btn-bg);border-radius:12px;width:38px;height:38px;place-items:center;color:var(--sub)}
.menu-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.scrim{display:none}
.rail.empty{display:none}
.resource-head{display:flex;gap:12px;align-items:flex-start}
.resource-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(139,92,246,.12);color:#c4b5fd;flex:0 0 auto}
.resource-icon svg{width:17px;height:17px}
.status{display:inline-flex;align-items:center;font-size:11.5px}
.dot{width:7px;height:7px;border-radius:50%;margin-right:7px;flex:0 0 auto}
.s-online .dot{background:var(--green)}.s-busy .dot{background:var(--yellow)}.s-off .dot{background:var(--sub2)}
.s-online{color:#6ee7b7}.s-busy{color:#fcd34d}.s-off{color:var(--sub2)}
.channel.off{opacity:.62}
.channel.off .logo{background:var(--btn-bg);color:var(--sub2)}

.post-actions button{display:flex;align-items:center;justify-content:center;gap:8px}
.post-actions button svg{width:15px;height:15px}
.composer-tools .mini{display:grid;place-items:center}
.composer-tools .mini svg{width:16px;height:16px}
.tag svg{width:11px;height:11px;flex:0 0 auto}
.idea-head button svg{width:14px;height:14px}
.verified svg{width:12px;height:12px;display:inline}
.top-user{display:flex;align-items:center;gap:10px}.top-user b{font-size:13px}.top-user span{display:block;font-size:10px;color:var(--sub2)}.top-user .logout{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 9px;color:var(--sub);font-size:11px}

.content{flex:1;overflow:auto;padding:24px 26px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}
.page-head h1{font-size:24px;letter-spacing:-.01em}.page-head p{margin-top:8px;color:var(--sub);font-size:13px;line-height:1.7}.crumb-line{font-size:11px;color:var(--sub2);letter-spacing:.08em;margin-bottom:10px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--btn-bg);color:var(--on-text);border-radius:11px;padding:9px 15px;font-size:12.5px;transition:.18s}
.btn:hover{border-color:rgba(139,92,246,.45);color:#fff}
.btn-p{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:0;color:#fff;font-weight:700;box-shadow:0 16px 30px -18px rgba(139,92,246,.9)}
.btn-p:hover{transform:translateY(-1px)}

.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--box);border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;transition:.2s}
.kpi .label{font-size:10px;letter-spacing:.14em;color:var(--sub2);text-transform:uppercase}
.kpi .value{font-size:28px;margin-top:10px;font-weight:700;letter-spacing:-.02em}
.kpi .delta{margin-top:8px;font-size:11px;color:var(--green);font-family:ui-monospace,monospace}
.kpi .delta.down{color:var(--red)}

.layout-main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.card{background:var(--box);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:inset 0 1px 0 var(--hover)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px}.card-h .sub{font-size:11px;color:var(--sub2);margin-top:4px}

.card-title{display:flex;align-items:center;gap:11px}
.title-icon{width:28px;height:28px;border-radius:10px;background:rgba(139,92,246,.14);color:#c4b5fd;display:grid;place-items:center;flex:0 0 auto}
.title-icon svg{width:15px;height:15px}

.card-b{padding:18px 19px}
.link-more{font-size:11px;color:#c4b5fd;text-decoration:none;cursor:pointer}

/* right rail */
.rail{border-left:1px solid var(--line);padding:22px 18px;overflow:auto;background:var(--rail)}
.rail h3{font-size:14px;margin-bottom:14px}
.rail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.title-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:16px;overflow:hidden}
.cover{height:150px;display:grid;place-items:center;font-size:38px;position:relative;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px var(--btn-bg),inset 0 -30px 60px rgba(0,0,0,.18)}
.cover span{display:none}
.cover span{filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));opacity:.92}
.cover .genre-row{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.title-body{padding:14px 15px}.title-body b{font-size:15px}.title-body .meta{display:flex;justify-content:space-between;margin-top:7px;color:var(--sub);font-size:11px}.badge-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tag{display:inline-flex;align-items:center;padding:3px 7px;border-radius:7px;border:1px solid var(--line);font-size:9.5px;color:var(--sub);white-space:nowrap}
.tag.purple{color:#c4b5fd;background:rgba(139,92,246,.13);border-color:rgba(139,92,246,.28)}
.tag.green{color:#6ee7b7;background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.28)}
.tag.red{color:#fda4af;background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.28)}
.tag.blue{color:#93c5fd;background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.28)}
.tag.yellow{color:#fcd34d;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.28)}

/* composer/feed */
.composer{display:flex;gap:13px;padding:18px 19px}
.composer-main{flex:1;display:flex;flex-direction:column;gap:12px}
.composer input{border:0;background:transparent;border-radius:0;padding:12px 2px;outline:0;font-size:13px}
.composer-tools{display:flex;align-items:center;gap:9px}
.composer-tools .mini{width:34px;height:34px;border:1px solid var(--line);background:var(--box3);border-radius:10px;color:#c4b5fd}
.composer-tools .post-btn{margin-left:auto}
.feed{display:flex;flex-direction:column;gap:14px}
.feed-filter{display:flex;gap:10px;margin:2px 0 2px}
.select-chip{border:0;background:transparent;color:var(--body2);font-size:12.5px;padding:8px 0}
.post{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 19px}
.post-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.post-top .who b{display:flex;align-items:center;gap:6px;font-size:13px}.post-top .who span{font-size:10.5px;color:var(--sub2)}
.verified{color:#60a5fa;font-size:11px}
.post-top .time{margin-left:auto;font-size:10.5px;color:var(--sub2)}
.post-top .menu{border:0;background:transparent;color:var(--sub2);font-size:18px}
.post h4{font-size:14.5px;line-height:1.6}.post p{margin-top:8px;color:var(--sub);font-size:12.5px;line-height:1.8}
.post-cover{height:188px;border-radius:16px;margin:15px 0;display:grid;place-items:center;font-size:0;overflow:hidden;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px var(--btn-bg),inset 0 -40px 80px rgba(0,0,0,.22)}
.post-cover{filter:drop-shadow(0 10px 22px rgba(0,0,0,.18))}
.post-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.post-actions button{border:0;background:var(--chip);border-radius:12px;height:44px;display:grid;place-items:center;color:var(--sub);font-size:12px}

.video-row{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.video-card{background:var(--box);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.video-thumb{height:112px;display:grid;place-items:center;font-size:32px;background-size:cover;background-position:center;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.video-thumb span{display:none}
.video-card b{display:block;font-size:12.5px;line-height:1.6;padding:12px 13px 4px}
.video-card span{display:block;font-size:10.5px;color:var(--sub2);padding:0 13px 13px}
.article-row{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.article-card{display:grid;grid-template-columns:54px 1fr;gap:11px;background:var(--box);border:1px solid var(--line);border-radius:15px;padding:13px;align-items:center}
.article-thumb{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font-size:22px;background-size:cover;background-position:center;filter:drop-shadow(0 6px 12px rgba(0,0,0,.22))}
.article-thumb span{display:none}
.article-card .tag{margin-bottom:7px}
.article-card b{font-size:11.5px;line-height:1.6;color:var(--on-text)}

.top5-filters{display:flex;gap:8px}.top5-filters button{border:1px solid var(--line);background:var(--input);border-radius:9px;padding:7px 10px;color:var(--sub);font-size:11px}
.top-game{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.top-game:last-of-type{border-bottom:0}
.top-thumb{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px var(--chip)}
.top-thumb svg{width:24px;height:24px}
.top-game b{display:block;font-size:13.5px}.top-game p{font-size:11px;color:var(--sub2);margin-top:4px}
.top-badges{display:flex;flex-direction:column;align-items:flex-end;gap:7px}



/* monitor rows */
.chart{display:flex;align-items:flex-end;gap:12px;height:150px;padding:10px 4px}
.chart i{flex:1;background:linear-gradient(180deg,#7c3aed,#312e81);border-radius:8px 8px 4px 4px;min-height:18px}
.metric{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center;background:var(--box);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
.metric:last-of-type{margin-bottom:0}
.metric .name{font-size:12.5px;color:var(--body2)}.metric .num{font-family:ui-monospace,monospace;font-size:18px;font-weight:700;color:var(--text)}
.monitor-cta{display:flex;justify-content:flex-end;margin-top:16px}

/* tables/cards */
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;font-size:10px;letter-spacing:.12em;color:var(--sub2);font-weight:500;padding:12px 14px;border-bottom:1px solid var(--line)}
tbody td{padding:13px 14px;border-bottom:1px solid var(--btn-bg);color:var(--body2)}
tbody tr:hover{background:var(--hover)}
.resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.resource{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;transition:.2s}
.resource:hover{transform:translateY(-2px);border-color:rgba(139,92,246,.35)}
.resource .top{display:flex;justify-content:space-between;gap:10px}.resource h4{font-size:14px}.resource p{margin:10px 0 13px;color:var(--sub);font-size:12px;line-height:1.8}
.resource .foot{display:flex;justify-content:space-between;color:var(--sub2);font-size:10.5px;font-family:ui-monospace,monospace}

.game-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center}
.game-thumb{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:0 0 auto;background-size:cover;background-position:center}
.game-main{min-width:0}.game-main h4{margin:0}.game-main p{margin:5px 0 0!important;color:var(--sub);font-size:12px}
.game-main .genre-row{position:static;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.game-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.game-side .sub2{color:var(--sub2);font-size:10.5px;font-family:ui-monospace,monospace}

.channel{display:flex;align-items:center;gap:14px;padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.channel .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(139,92,246,.14);color:#c4b5fd;font-weight:700}
.channel .info{flex:1}.channel b{font-size:13.5px}.channel p{font-size:11px;color:var(--sub2);margin-top:4px}
.switch{position:relative;width:42px;height:23px;border-radius:999px;background:var(--chip);border:1px solid var(--line);cursor:pointer;transition:.2s}
.switch.on{background:rgba(139,92,246,.35);border-color:rgba(139,92,246,.55)}
.switch i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{left:21px}

.api-split{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
.api-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.api-bar{display:flex;gap:8px;padding:13px;border-bottom:1px solid var(--line)}
.api-bar select,.api-bar input{background:var(--input2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:0;font-family:ui-monospace,monospace;font-size:12px}
.api-bar input{flex:1}
pre{margin:0;padding:16px;font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.8;color:var(--code);white-space:pre-wrap}
.log-row{display:grid;grid-template-columns:86px 70px 1fr 80px;gap:12px;padding:12px 14px;border-bottom:1px solid var(--btn-bg);font-family:ui-monospace,monospace;font-size:11.5px}
.log-row:last-child{border-bottom:0}.lv-INFO{color:#93c5fd}.lv-WARN{color:#fcd34d}.lv-ERROR{color:#fda4af}

.doc{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px;overflow:hidden}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function initSupabase(){

function normAccount(a){a=String(a||'').trim();if(!a)return '';return a.includes('@')?a:`${a}@example.com`;}
function showLoginMask(show){document.getElementById('loginMask').hidden=!show;}
function loginErr(msg){const el=document.getElementById('loginErr');if(msg){el.textContent=msg;el.hidden=false;}else{el.hidden=true;}}
async function resolveProfile(uid){
  if(!sbClient||!uid) return null;
  const {data}=await sbClient.from('profiles').select('*').eq('auth_id',uid).limit(1);
  return (data&&data[0])||null;
}
async function applySession(session){
  if(!session||!session.user){currentUser=null;return null;}
  const uid=session.user.id,email=session.user.email||'';
  const profile=await resolveProfile(uid);
  currentUser={uid,email,role:(profile&&profile.role)||'dev',profile:profile||{name:email.split('@')[0]||'开发者',role:'dev',email}};
  return currentUser;
}
async function doLogin(){
  if(!sbClient){toast('登录服务未就绪，请稍后重试');return;}
  const email=normAccount(document.getElementById('loginEmail').value);
  const password=document.getElementById('loginPassword').value;
  const btn=document.getElementById('loginBtn');loginErr('');
  if(!email||!password){loginErr(t('login_empty'));return;}
  btn.disabled=true;btn.textContent=t('login_loading');
  try{
    const {data,error}=await sbClient.auth.signInWithPassword({email,password});
    if(error)throw error;
    await applySession(data.session);
    showLoginMask(false);updateTopUser();buildNav();go(landingTab());toast(t('welcome')+currentUser.profile.name);
  }catch(e){
    console.warn(e);
    loginErr(e&&e.message?(t('login_fail')+e.message):t('login_fail_unknown'));
  }finally{btn.disabled=false;btn.textContent=t('login_submit');}
}
let AUTH_MODE='login';
function regErr(msg){const el=document.getElementById('regErr');if(msg){el.textContent=msg;el.hidden=false;}else{el.hidden=true;}}
function setAuthMode(mode){
  AUTH_MODE=mode;
  document.getElementById('loginForm').hidden=mode!=='login';
  document.getElementById('regForm').hidden=mode!=='register';
  const isReg=mode==='register';
  document.getElementById('loginTitle').textContent=isReg?t('register_title'):t('login_title');
  document.getElementById('loginSub').textContent=isReg?t('register_sub'):t('login_sub');
  const sw=document.getElementById('loginSwitch');if(sw)sw.textContent=isReg?('← '+t('back_login')):(t('register')+' →');
  loginErr('');regErr('');
  if(isReg)refreshCaptcha();
}
let CAPTCHA_CODE='';
function refreshCaptcha(){
  const cv=document.getElementById('regCaptcha');if(!cv)return;
  const ctx=cv.getContext('2d');
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code='';for(let i=0;i<4;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  CAPTCHA_CODE=code;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#17142a';ctx.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<4;i++){ctx.strokeStyle='rgba(139,92,246,.35)';ctx.beginPath();ctx.moveTo(Math.random()*cv.width,Math.random()*cv.height);ctx.lineTo(Math.random()*cv.width,Math.random()*cv.height);ctx.stroke();}
  ctx.font='bold 22px ui-monospace,Menlo,monospace';ctx.textBaseline='middle';
  const cols=['#c4b5fd','#22d3ee','#fbbf24','#f97316'];
  for(let i=0;i<code.length;i++){ctx.fillStyle=cols[i];ctx.fillText(code[i],16+i*22,22);}
  for(let i=0;i<18;i++){ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(Math.random()*cv.width,Math.random()*cv.height,2,2);}
}
function captchaOk(){
  const v=(document.getElementById('regCaptchaInput').value||'').trim().toLowerCase();
  return !!v && v===CAPTCHA_CODE.toLowerCase();
}
function toggleAuthMode(){setAuthMode(AUTH_MODE==='login'?'register':'login');}
async function doRegister(){
  if(!sbClient){toast('注册服务未就绪，请稍后重试');return;}
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const password=document.getElementById('regPassword').value;
  const btn=document.getElementById('regBtn');regErr('');
  if(!email||!password){regErr(t('login_empty'));return;}
  if(!captchaOk()){regErr(t('captcha_err'));refreshCaptcha();const ci=document.getElementById('regCaptchaInput');if(ci)ci.value='';return;}
  btn.disabled=true;btn.textContent=t('login_loading');
  try{
    const {data,error}=await sbClient.auth.signUp({email,password,options:{data:{name:name||email.split('@')[0]}}});
    if(error)throw error;
    if(data&&data.session){
      await applySession(data.session);
      showLoginMask(false);updateTopUser();buildNav();go(landingTab());toast(t('welcome')+currentUser.profile.name);
    }else{
      toast(t('reg_hint'));setAuthMode('login');
    }
  }catch(e){
    console.warn(e);
    regErr(e&&e.message?(t('login_fail')+e.message):t('login_fail_unknown'));
  }finally{btn.disabled=false;btn.textContent=t('reg_submit');}
}
async function doLogout(){
  if(sbClient){await sbClient.auth.signOut().catch(()=>{});}
  currentUser=null;showLoginMask(true);updateTopUser();applyLoginTexts();toast(t('logged_out'));
}
function requireLogin(){
  if(currentUser)return true;
  showLoginMask(true);toast('请先登录后再操作');return false;
}
function isAdmin(){return !!(currentUser&&currentUser.profile&&currentUser.profile.role==='admin');}
function landingTab(){return isAdmin()?'admin':'overview';}
function audit(action,target,detail){
  const actor=currentUser?currentUser.profile.name:'system';
  AUDIT.unshift({actor,action,target:target||'',detail:detail||'',time:'刚刚'});
  if(sbClient){sbClient.from('audit_logs').insert({actor,action,target:target||'',detail:detail||''}).then(({error})=>{if(error)console.warn('审计写库失败：',error);});}
}
async function loadRemoteData(){
  if(!sbClient){const ok=await initSupabase();if(!ok||!sbClient) return;}
  try{
    const [g,r,c,l,p,m,cm,tk,ms,sh,au,pr]=await Promise.all([
      sbClient.from('games').select('*'),
      sbClient.from('resources').select('*'),
      sbClient.from('channels').select('*'),
      sbClient.from('logs').select('*'),
      sbClient.from('posts').select('*,profiles(name,role)'),
      sbClient.from('profiles').select('*'),
      sbClient.from('comments').select('*'),
      sbClient.from('tasks').select('*'),
      sbClient.from('messages').select('*'),
      sbClient.from('shares').select('*'),
      sbClient.from('audit_logs').select('*'),
      sbClient.from('projects').select('*')
    ]);
    if(!g.error&&g.data&&g.data.length){
      GAMES=g.data.map((x,i)=>({name:x.name,studio:x.studio,genre:x.genre||[],score:x.score||0,downloads:x.downloads||'0',color:COVERS[i%COVERS.length],cover:x.cover_url||COVERS[i%COVERS.length],emoji:'',desc:x.description||'',url:x.download_url||''}));
    }
    if(!r.error&&r.data&&r.data.length){
      RES=r.data.map(x=>({id:x.id||'',n:x.name,t:x.type,v:x.version,d:x.description,size:x.size}));
    }
    if(!c.error&&c.data&&c.data.length){
      CHANNELS=c.data.map(x=>({id:x.id,n:x.name,code:(x.provider||'').toUpperCase(),k:x.key_masked,on:!!x.enabled,last:x.last_sync?String(x.last_sync).replace('T',' ').slice(0,16):''}));
    }
    if(!l.error&&l.data&&l.data.length){
      LOGS=l.data.map(x=>({t:String(x.ts||'').slice(11,19),lv:x.level||'INFO',m:x.message,u:x.actor||'system'}));
    }
    if(!p.error&&p.data&&p.data.length){
      POSTS=p.data.map(x=>{const pf=Array.isArray(x.profiles)?x.profiles[0]:x.profiles;return {id:x.id,authorId:x.author_id,cat:x.category,title:x.title,author:(pf&&pf.name)||'开发者',role:(pf&&pf.role)||'dev',time:x.created_at?String(x.created_at).replace('T',' ').slice(5,16):'',likes:x.likes||0,replies:x.replies||0,views:x.views||'0',tags:x.tags||[]};});
    }
    if(!m.error&&m.data&&m.data.length){
      MEMBERS=m.data.map(x=>({id:x.id,authId:x.auth_id,name:x.name,role:x.role,email:x.email,status:x.status,projects:x.projects||0,avatar:x.avatar}));
    }
    const ft=v=>v?String(v).slice(5,16).replace('T',' '):'';
    if(!cm.error&&cm.data){COMMENTS=cm.data.map(x=>({target_type:x.target_type,target_id:x.target_id,author_id:x.author_id,author_name:x.author_name,role:x.role,body:x.body,time:ft(x.created_at)}));}
    if(!tk.error&&tk.data){TASKS=tk.data.map(x=>({id:x.id,title:x.title,detail:x.detail,assignee_name:x.assignee_name,creator_name:x.creator_name,status:x.status,priority:x.priority,time:ft(x.created_at)}));}
    if(!ms.error&&ms.data){MESSAGES=ms.data.map(x=>({id:x.id,channel:x.channel,sender_name:x.sender_name,body:x.body,time:ft(x.created_at)}));}
    if(!sh.error&&sh.data){SHARES=sh.data.map(x=>({id:x.id,resource_name:x.resource_name,from_name:x.from_name,to_name:x.to_name,note:x.note,time:ft(x.created_at)}));}
    if(!au.error&&au.data){AUDIT=au.data.map(x=>({actor:x.actor,action:x.action,target:x.target,detail:x.detail,time:ft(x.created_at)}));}
    if(!pr.error&&pr.data&&pr.data.length){
      const remote=pr.data.map(x=>({id:x.id,name:x.name,template:x.template,kind:x.template==='scene3d'?'3d':'2d',code:x.code,status:x.status||'开发中',updated:ft(x.updated_at),owner:x.owner_name||''}));
      const local=PROJECTS.filter(lp=>!remote.some(rp=>rp.id===lp.id));
      PROJECTS=remote.concat(local);saveProjectsLocal();
    }
  }catch(e){console.warn('Supabase 数据加载失败，已回退本地示例数据：',e);}
}

function replyRow(author,role,body,time){
  return `<div class="reply"><div class="avatar">${esc(String(author).slice(0,1))}</div><div style="flex:1"><b>${esc(author)}</b><span class="sub2" style="font-size:10px;margin-left:6px">${role||''}</span><p>${esc(body)}</p></div><span class="time">${esc(time||'')}</span></div>`;
}
function commentSection(type,id){
  const list=COMMENTS.filter(c=>c.target_type===type&&c.target_id===id);
  let rows;
  if(type==='post'&&!list.length){
    rows=DEMO_REPLIES.map(r=>replyRow(r.author,r.role,r.text,r.time)).join('');
  }else{
    rows=list.length?list.map(c=>replyRow(c.author_name,c.role,c.body,c.time)).join(''):`<div class="comment-empty">${t('comment_empty')}</div>`;
  }
  return `<div class="sec-title">${t('replies_title')} · ${list.length}</div><div class="reply-list">${rows}</div>
  <div class="comment-box"><input id="commentInput" placeholder="${t('comment_ph')}" onkeydown="if(event.key==='Enter')submitComment('${type}','${esc(id)}')"><button class="btn btn-p" onclick="submitComment('${type}','${esc(id)}')">${t('comment_send')}</button></div>`;
}
async function submitComment(type,id){
  if(!requireLogin())return;
  const inp=document.getElementById('commentInput');const body=(inp?inp.value:'').trim();
  if(!body){toast(t('comment_ph'));return;}
  const pf=currentUser.profile;
  COMMENTS.unshift({target_type:type,target_id:id,author_id:pf.id||null,author_name:pf.name,role:pf.role||'dev',body,time:'刚刚'});
  renderModalCurrent();
  if(sbClient){
    const {error}=await sbClient.from('comments').insert({target_type:type,target_id:id,author_id:pf.id||null,author_name:pf.name,role:pf.role||'dev',body});
    if(error){console.warn('评论写库失败，已保留本地：',error);}
  }
  toast(t('comment_send'));
}

let MEMBER_PANEL='info';
function taskStatusLabel(s){return s==='done'?t('st_done'):s==='doing'?t('st_doing'):t('st_todo');}
function msgChannel(a,b){return [a,b].sort().join('|');}
function setMemberPanel(panel,name){MEMBER_PANEL=panel;openMember(name);}
function msgPanel(m){
  const me=currentUser?currentUser.profile.name:'';
  const ch=msgChannel(me,m.name);
  const ms=MESSAGES.filter(x=>x.channel===ch);
  const rows=ms.length?ms.map(x=>`<div class="msg ${x.sender_name===me?'me':''}"><b>${esc(x.sender_name)}</b><p>${esc(x.body)}</p><span>${esc(x.time||'')}</span></div>`).join(''):`<div class="comment-empty">${t('comment_empty')}</div>`;
  return `<div class="msg-list">${rows}</div>
  <div class="comment-box"><input id="msgInput" placeholder="${t('msg_ph')}" onkeydown="if(event.key==='Enter')sendMessage('${esc(m.name)}')"><button class="btn btn-p" onclick="sendMessage('${esc(m.name)}')">${t('comment_send')}</button></div>`;
}
function taskPanel(m){
  const list=TASKS.filter(x=>x.assignee_name===m.name);
  const rows=list.length?list.map((x,i)=>`<div class="task-row clickable" onclick="cycleTask('${esc(m.name)}','${i}')"><div><b>${esc(x.title)}</b><p>${esc(x.detail||'')}</p></div><span class="tag ${x.status==='done'?'green':x.status==='doing'?'blue':'yellow'}">${taskStatusLabel(x.status)}</span></div>`).join(''):`<div class="comment-empty">${t('comment_empty')}</div>`;
  return `<div class="sec-title">${t('coop_tasks')}</div>${rows}
  <div class="coop-form">
    <input id="taskTitle" placeholder="${t('task_title')}">
    <input id="taskDetail" placeholder="${t('task_detail')}">
    <select id="taskPriority"><option value="low">${t('pr_low')}</option><option value="normal" selected>${t('pr_normal')}</option><option value="high">${t('pr_high')}</option></select>
    <button class="btn btn-p" onclick="createTask('${esc(m.name)}')">${t('task_create')}</button>
  </div>`;
}
function sharePanel(m){
  const list=SHARES.filter(x=>x.to_name===m.name);
  const rows=list.length?list.map(x=>`<div class="task-row"><div><b>${esc(x.resource_name)}</b><p>${esc(x.note||'')}</p></div><span class="sub2" style="font-size:10px">${esc(x.from_name)} · ${esc(x.time||'')}</span></div>`).join(''):`<div class="comment-empty">${t('comment_empty')}</div>`;
  const opts=RES.map(r=>`<option value="${r.id}">${esc(r.n)}</option>`).join('');
  return `<div class="sec-title">${t('coop_shares')}</div>${rows}
  <div class="coop-form"><select id="shareRes">${opts}</select><input id="shareNote" placeholder="${t('share_note')}"><button class="btn btn-p" onclick="shareResource('${esc(m.name)}')">${t('share_send')}</button></div>`;
}
function openMember(name){
  const m=MEMBERS.find(x=>x.name===name);if(!m)return;
  S._modal={fn:'openMember',arg:name};
  const p=MEMBER_PANEL;
  const tabs=`<div class="coop-tabs">
    <button class="${p==='info'?'on':''}" onclick="setMemberPanel('info','${esc(name)}')">${t('col_member')}</button>
    <button class="${p==='msg'?'on':''}" onclick="setMemberPanel('msg','${esc(name)}')">${t('coop_msgs')}</button>
    <button class="${p==='task'?'on':''}" onclick="setMemberPanel('task','${esc(name)}')">${t('coop_tasks')}</button>
    <button class="${p==='share'?'on':''}" onclick="setMemberPanel('share','${esc(name)}')">${t('coop_shares')}</button>
  </div>`;
  let body='';
  if(p==='msg')body=msgPanel(m);
  else if(p==='task')body=taskPanel(m);
  else if(p==='share')body=sharePanel(m);
  else body=`<div class="meta">${avatarHTML(m.name,m.avatar)}<b>${esc(m.name)}</b><span class="tag purple">${m.role}</span><span class="status ${m.status==='在线'?'s-online':m.status==='忙碌'?'s-busy':'s-off'}">${statusLabel(m.status)}</span></div>
    <h2>${esc(m.name)}</h2>
    <div class="stat-row">
      <div class="m"><b>${m.email}</b><span>${t('col_email')}</span></div>
      <div class="m"><b>${m.projects}</b><span>${t('col_projects')}</span></div>
    </div>`;
  openModal(`<div class="modal-body">${tabs}${body}</div>`);
}
async function sendMessage(toName){
  if(!requireLogin())return;
  const inp=document.getElementById('msgInput');const body=(inp?inp.value:'').trim();if(!body){toast(t('msg_ph'));return;}
  const pf=currentUser.profile;const ch=msgChannel(pf.name,toName);
  MESSAGES.push({channel:ch,sender_id:pf.id||null,sender_name:pf.name,body,time:'刚刚'});
  openMember(toName);
  if(sbClient){const {error}=await sbClient.from('messages').insert({channel:ch,sender_id:pf.id||null,sender_name:pf.name,body});if(error)console.warn('消息写库失败：',error);}
}
async function createTask(assigneeName){
  if(!requireLogin())return;
  const title=(document.getElementById('taskTitle').value||'').trim();if(!title){toast(t('task_title'));return;}
  const detail=(document.getElementById('taskDetail').value||'').trim();
  const priority=document.getElementById('taskPriority').value;
  const pf=currentUser.profile;
  TASKS.push({title,detail,assignee_name:assigneeName,assignee_id:null,creator_id:pf.id||null,creator_name:pf.name,status:'todo',priority,time:'刚刚'});
  openMember(assigneeName);toast(t('task_create'));
  if(sbClient){const {error}=await sbClient.from('tasks').insert({title,detail,assignee_name:assigneeName,creator_id:pf.id||null,creator_name:pf.name,status:'todo',priority});if(error)console.warn('任务写库失败：',error);}
}
async function cycleTask(assigneeName,i){
  const list=TASKS.filter(x=>x.assignee_name===assigneeName);const tk=list[i];if(!tk)return;
  tk.status=tk.status==='todo'?'doing':tk.status==='doing'?'done':'todo';
  openMember(assigneeName);
  if(sbClient&&tk.id){const {error}=await sbClient.from('tasks').update({status:tk.status}).eq('id',tk.id);if(error)console.warn(error);}

function buildNotifs(){

  LOGS.filter(l=>l.lv==='WARN'||l.lv==='ERROR').forEach(l=>list.push({level:l.lv,title:l.lv==='ERROR'?t('n_error'):t('n_warn'),body:l.m,time:l.t}));

/* ---------- 日志导出 CSV ---------- */
function exportLogs(){
  const head=['时间','级别','消息','操作人'];
  const rows=LOGS.map(l=>[l.t,l.lv,l.m,l.u]);
  const csv=[head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='devrealm-logs.csv';a.click();URL.revokeObjectURL(a.href);
  toast('日志已导出 CSV');
}

/* ---------- API 调试：真实只读请求 ---------- */
async function sendApiRequest(btn){
  const out=document.getElementById('apiBody');const status=document.getElementById('apiStatus');
  if(btn)btn.disabled=true;
  try{
    let data=[];
    if(sbClient){const {data:d,error}=await sbClient.from('games').select('name,studio,score,downloads').limit(6);if(error)throw error;data=d||[];}
    out.textContent=JSON.stringify({code:200,data:{total:data.length,items:data}},null,2);
    if(status)status.textContent='200 · OK';
    toast('已发送真实只读请求');
  }catch(err){out.textContent=JSON.stringify({code:500,message:String(err&&err.message||err)},null,2);if(status)status.textContent='500 · ERR';toast('请求失败，使用演示响应');}
  if(btn)btn.disabled=false;
}

async function toggleLike(i){

  if(!p.id||!sbClient)return;
  const {error}=await sbClient.from('posts').update({likes:p.likes}).eq('id',p.id);
  if(error){S.liked[i]=!now;p.likes=Math.max(0,(p.likes||0)-delta);render();toast('点赞失败，请重试');console.warn(error);}
}

    const {data,error}=await sbClient.from('posts').insert({title,body:title,category:'general',tags:[],author_id:profile.id,likes:0,replies:0,views:'0'}).select('*,profiles(name,role)').single();

    POSTS.unshift({id:data.id,authorId:data.author_id,cat:data.category||'general',title:data.title,author:(pf&&pf.name)||profile.name,role:(pf&&pf.role)||profile.role,time:String(data.created_at).replace('T',' ').slice(5,16),likes:0,replies:0,views:'0',tags:data.tags||[]});

let editorRAF=null,editorKeys={},editorTap=null;
function openEditor(pid){
  const p=PROJECTS.find(x=>x.id===pid);if(!p)return;

      <div class="editor-status" id="editorStatus">${t('editor_idle')}</div></div>
  </div>`);
  const cv=document.getElementById('editorCanvas');
  cv.addEventListener('pointerdown',e=>{
    const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)*cv.width/r.width;
    const y=(e.clientY-r.top)*cv.height/r.height;

  });
}
function bindEditorKeys(){
  window.addEventListener('keydown',e=>{editorKeys[e.key]=true;});
  window.addEventListener('keyup',e=>{editorKeys[e.key]=false;});
}
function runEditor(){
  const cv=document.getElementById('editorCanvas');if(!cv)return;
  const ctx=cv.getContext('2d');
  stopEditor();
  const code=(document.getElementById('editorCode').value||'');
  const keys=editorKeys,mouse={x:0,y:0,down:false};
  const status=document.getElementById('editorStatus');
  try{
    const factory=new Function('canvas','ctx','keys','mouse','bindTap',
      code+'\n;return {setup:typeof setup!=="undefined"?setup:null,update:typeof update!=="undefined"?update:null,draw:typeof draw!=="undefined"?draw:null};');
    const hooks=factory(cv,ctx,keys,mouse,fn=>{editorTap=fn;});
    if(hooks.setup)hooks.setup();
    let last=performance.now();
    const loop=(now)=>{
      const dt=Math.min(0.05,(now-last)/1000);last=now;
      if(hooks.update)hooks.update(dt);
      ctx.fillStyle='#17142a';ctx.fillRect(0,0,cv.width,cv.height);
      if(hooks.draw)hooks.draw();
      editorRAF=requestAnimationFrame(loop);
    };
    editorRAF=requestAnimationFrame(loop);
    status.className='editor-status';status.textContent=t('editor_running');
  }catch(err){
    stopEditor();
    status.className='editor-status err';status.textContent=t('editor_error')+': '+err.message;
  }
}
function stopEditor(){if(editorRAF)cancelAnimationFrame(editorRAF);editorRAF=null;editorTap=null;}

/* ---------- 3D 编辑器 ---------- */
let g3d=null;
function loadThree(){
  if(window.THREE)return Promise.resolve(window.THREE);
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://fastly.jsdelivr.net/npm/three@0.152.2/build/three.min.js';
    s.onload=()=>window.THREE?res(window.THREE):rej(new Error('THREE missing'));
    s.onerror=()=>rej(new Error('load fail'));
    document.head.appendChild(s);
  });
}
function openEditor3d(p){
  let data;
  try{data=JSON.parse(p.code);}catch(e){data=null;}
  if(!data||!Array.isArray(data.entities))data=defaultScene();
  g3d={pid:p.id,data,selectedId:data.entities[0]?data.entities[0].id:null,three:null,raf:null,
    cam:{theta:0.6,phi:1.1,radius:8,target:[0,0.8,0]}};
  openModal(`<div class="sec-title">${esc(p.name)}</div>
  <div class="editor-3d">
    <div class="editor-pane">
      <div class="editor-bar">${t('e3d_entities')}
        <button class="mini-btn" onclick="e3dAdd()">${t('e3d_add')}</button>
        <button class="mini-btn danger" onclick="e3dDel()">${t('e3d_del')}</button></div>
      <div class="entity-list" id="e3dList"></div>
    </div>
    <div class="viewport-3d" id="e3dViewport"><div class="viewport-hint" id="e3dHint">${t('e3d_hint')}</div></div>
    <div class="editor-pane">
      <div class="editor-bar">${t('e3d_props')}</div>
      <div style="padding:12px" id="e3dProps"></div>
      <div class="editor-bar">${t('e3d_tex')}</div>
      <div style="padding:12px">
        <div class="tex-grid" id="e3dTexs"></div>
        <button class="mini-btn" style="margin-top:10px" onclick="document.getElementById('e3dTexFile').click()">${t('e3d_upload_tex')}</button>
        <input type="file" id="e3dTexFile" accept="image/*" hidden onchange="e3dTexFile(event)">
      </div>
      <div style="padding:0 12px 12px"><button class="btn btn-p" onclick="saveProject()">${t('save')}</button></div>
    </div>
  </div>`);
  loadThree().then(init3d).catch(()=>{
    const vp=document.getElementById('e3dViewport');
    if(vp)vp.innerHTML=`<div class="comment-empty" style="margin:auto">${t('e3d_load_err')}</div>`;
  });
}
function init3d(){
  const THREE=window.THREE;if(!THREE)return;
  const vp=document.getElementById('e3dViewport');if(!vp)return;
  const w=vp.clientWidth||600,h=vp.clientHeight||380;
  let renderer=null;
  try{
    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(w,h);renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
    vp.appendChild(renderer.domElement);
  }catch(e){renderer=null;}
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x0f0d1d);
  const camera=new THREE.PerspectiveCamera(50,w/h,0.1,100);
  scene.add(new THREE.AmbientLight(0xffffff,0.75));
  const dir=new THREE.DirectionalLight(0xffffff,1.1);dir.position.set(4,8,6);scene.add(dir);
  g3d.three={renderer,scene,camera,entities:new Map()};
  g3d.data.entities.forEach(buildEnt);
  bind3dControls(vp,camera);
  render3dList();render3dProps();render3dTexs();
  if(renderer){
    const loop=()=>{updateCamera(camera);renderer.render(scene,camera);g3d.raf=requestAnimationFrame(loop);};
    g3d.raf=requestAnimationFrame(loop);
  }else{
    const hint=document.getElementById('e3dHint');
    if(hint)hint.textContent=t('e3d_webgl');
  }
  window.addEventListener('resize',e3dResize);
}
function buildEnt(ent){
  const THREE=window.THREE;let geo;
  if(ent.mesh==='sphere')geo=new THREE.SphereGeometry(0.5,32,24);
  else if(ent.mesh==='plane')geo=new THREE.PlaneGeometry(1,1);
  else geo=new THREE.BoxGeometry(1,1,1);
  const mat=new THREE.MeshStandardMaterial({color:ent.color||'#888888'});
  if(ent.texture)new THREE.TextureLoader().load(ent.texture,tex=>{mat.map=tex;mat.needsUpdate=true;});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.fromArray(ent.position||[0,0,0]);
  mesh.scale.fromArray(ent.scale||[1,1,1]);
  if(ent.mesh==='plane')mesh.rotation.x=-Math.PI/2;
  mesh.userData.id=ent.id;
  g3d.three.scene.add(mesh);
  g3d.three.entities.set(ent.id,{mesh,data:ent});
}
function updateCamera(camera){
  const THREE=window.THREE,c=g3d.cam,t=new THREE.Vector3(...c.target);
  const x=c.radius*Math.sin(c.phi)*Math.sin(c.theta);
  const y=c.radius*Math.cos(c.phi);
  const z=c.radius*Math.sin(c.phi)*Math.cos(c.theta);
  camera.position.set(t.x+x,t.y+y,t.z+z);
  camera.lookAt(t);
}
function bind3dControls(vp,camera){
  let dragging=false,px=0,py=0,moved=0;const c=g3d.cam;
  vp.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;moved=0;try{vp.setPointerCapture(e.pointerId);}catch(_){}});
  vp.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    c.theta-=dx*0.008;c.phi-=dy*0.008;
    c.phi=Math.max(0.15,Math.min(Math.PI-0.15,c.phi));
  });
  vp.addEventListener('pointerup',e=>{dragging=false;if(moved<5)e3dPick(e);});
  vp.addEventListener('wheel',e=>{e.preventDefault();c.radius=Math.max(2,Math.min(30,c.radius+e.deltaY*0.01));},{passive:false});
}
function e3dPick(e){
  const THREE=window.THREE,g=g3d.three;if(!g||!g.renderer)return;
  const rect=g.renderer.domElement.getBoundingClientRect();
  const nx=((e.clientX-rect.left)/rect.width)*2-1;
  const ny=-((e.clientY-rect.top)/rect.height)*2+1;
  const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(nx,ny),g.camera);
  const meshes=[...g.entities.values()].map(v=>v.mesh);
  const hits=ray.intersectObjects(meshes,false);
  if(hits.length){g3d.selectedId=hits[0].object.userData.id;render3dList();render3dProps();render3dTexs();}
}
function selEnt(){return g3d?g3d.data.entities.find(x=>x.id===g3d.selectedId):null;}
function render3dList(){
  const el=document.getElementById('e3dList');if(!el)return;
  el.innerHTML=g3d.data.entities.map(ent=>`
    <div class="entity-item ${ent.id===g3d.selectedId?'on':''}" onclick="e3dSelect('${ent.id}')">
      <span class="dot" style="color:${esc(ent.color||'#888888')}"></span><span>${esc(ent.name)}</span>
    </div>`).join('')||'<div class="comment-empty">—</div>';
}
function e3dSelect(id){g3d.selectedId=id;render3dList();render3dProps();render3dTexs();}
function render3dProps(){
  const el=document.getElementById('e3dProps');if(!el)return;
  const ent=selEnt();
  if(!ent){el.innerHTML=`<div class="comment-empty">${t('e3d_none')}</div>`;return;}
  const p=ent.position||[0,0,0],s=ent.scale||[1,1,1];
  const row=(label,val,fn)=>`<div class="prop-row"><span>${label}</span><input type="number" step="0.1" value="${val}" oninput="${fn}"></div>`;
  el.innerHTML=`
    ${row(t('e3d_pos')+' X',p[0],`e3dProp('position',0,this.value)`)}
    ${row(t('e3d_pos')+' Y',p[1],`e3dProp('position',1,this.value)`)}
    ${row(t('e3d_pos')+' Z',p[2],`e3dProp('position',2,this.value)`)}
    ${row(t('e3d_scale')+' X',s[0],`e3dProp('scale',0,this.value)`)}
    ${row(t('e3d_scale')+' Y',s[1],`e3dProp('scale',1,this.value)`)}
    ${row(t('e3d_scale')+' Z',s[2],`e3dProp('scale',2,this.value)`)}
    <div class="prop-row"><span>${t('e3d_color')}</span><input type="color" value="${esc(ent.color||'#888888')}" oninput="e3dColor(this.value)"></div>`;
}
function e3dProp(field,idx,val){
  const ent=selEnt();if(!ent)return;
  ent[field][idx]=parseFloat(val)||0;
  const rec=g3d.three.entities.get(ent.id);
  if(rec){if(field==='position')rec.mesh.position.fromArray(ent.position);else rec.mesh.scale.fromArray(ent.scale);}
}
function e3dColor(val){
  const ent=selEnt();if(!ent)return;
  ent.color=val;
  const rec=g3d.three.entities.get(ent.id);
  if(rec)rec.mesh.material.color.set(val);
  render3dList();
}
function e3dAdd(){
  const n=g3d.data.entities.length+1;
  const ent={id:'e'+Date.now(),name:'实体 '+n,mesh:'box',position:[0,1,0],scale:[1,1,1],color:'#f0abfc',texture:null};
  g3d.data.entities.push(ent);buildEnt(ent);
  g3d.selectedId=ent.id;render3dList();render3dProps();render3dTexs();
}
function e3dDel(){
  if(!g3d.selectedId)return;
  const rec=g3d.three.entities.get(g3d.selectedId);
  if(rec){g3d.three.scene.remove(rec.mesh);rec.mesh.geometry.dispose();rec.mesh.material.dispose();g3d.three.entities.delete(g3d.selectedId);}
  g3d.data.entities=g3d.data.entities.filter(x=>x.id!==g3d.selectedId);
  g3d.selectedId=g3d.data.entities[0]?g3d.data.entities[0].id:null;
  render3dList();render3dProps();render3dTexs();
}
function render3dTexs(){
  const el=document.getElementById('e3dTexs');if(!el)return;
  const ent=selEnt();
  if(!ent||!ent.texture){el.innerHTML=`<div class="comment-empty">${t('e3d_tex_empty')}</div>`;return;}
  el.innerHTML=`<div class="tex on" style="background-image:url('${ent.texture}')"></div>`;
}
function e3dTexFile(ev){
  const f=ev.target.files&&ev.target.files[0];const ent=selEnt();if(!f||!ent)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const size=256,c=document.createElement('canvas');c.width=c.height=size;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0,size,size);
      ent.texture=c.toDataURL('image/png');
      const rec=g3d.three.entities.get(ent.id);
      if(rec){const tex=new window.THREE.TextureLoader().load(ent.texture);rec.mesh.material.map=tex;rec.mesh.material.needsUpdate=true;}
      render3dTexs();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
  ev.target.value='';
}
function e3dResize(){
  if(!g3d||!g3d.three)return;
  const vp=document.getElementById('e3dViewport');if(!vp)return;
  const w=vp.clientWidth,h=vp.clientHeight;
  g3d.three.camera.aspect=w/h;g3d.three.camera.updateProjectionMatrix();
  if(g3d.three.renderer)g3d.three.renderer.setSize(w,h);
}
function stopEditor3d(){
  if(!g3d)return;
  if(g3d.raf)cancelAnimationFrame(g3d.raf);
  if(g3d.three){
    g3d.three.entities.forEach(rec=>{
      if(rec.mesh.geometry)rec.mesh.geometry.dispose();
      if(rec.mesh.material)rec.mesh.material.dispose();
    });
    if(g3d.three.renderer)g3d.three.renderer.dispose();
  }
  g3d=null;
}

function onAvatarFile(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const size=96;const c=document.createElement('canvas');c.width=c.height=size;
      const ctx=c.getContext('2d');
      const r=Math.min(img.width,img.height);const sx=(img.width-r)/2,sy=(img.height-r)/2;
      ctx.drawImage(img,sx,sy,r,r,0,0,size,size);
      saveAvatar(c.toDataURL('image/png'));closeModal();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
}

const CONTENT_KINDS=[['games','nav_games'],['posts','nav_community'],['resources','nav_assets'],['members','nav_users'],['channels','nav_channels']];
function adminContent(){

function adminTable(kind){
  const arr=adminArr(kind);
  const head={games:['#',t('col_game'),t('col_studio'),t('col_genre'),t('col_score'),t('col_downloads'),''],
    posts:['#',t('post_detail'),t('col_member'),t('col_role'),t('likes'),t('post_reply'),''],
    resources:['#',t('assets_title'),t('col_genre'),t('res_version'),t('res_size'),'',''],
    members:['#',t('col_member'),t('col_role'),t('col_email'),t('col_projects'),t('col_status'),''],
    channels:['#',t('col_game'),t('link_key'),t('col_status'),'','','']}[kind];
  const ths=head.map(h=>`<th>${h}</th>`).join('');
  const rows=arr.map((x,i)=>{
    let cells='';
    if(kind==='games')cells=[i+1,esc(x.name),esc(x.studio),x.genre.map(genreLabel).join(' / '),x.score,x.downloads];
    else if(kind==='posts')cells=[i+1,esc(x.title),esc(x.author),esc(x.cat),x.likes,x.replies];
    else if(kind==='resources')cells=[i+1,esc(x.n),esc(x.t),x.v,x.size,''];
    else if(kind==='members')cells=[i+1,esc(x.name),`<span class="tag purple">${x.role}</span>`,esc(x.email),x.projects,statusLabel(x.status)];
    else if(kind==='channels')cells=[i+1,esc(x.n),esc(x.k),x.on?t('st_online'):t('st_offline')];
    const ops=`<button class="mini-btn" onclick="openAdminForm('${kind}',${i})">${t('edit')}</button><button class="mini-btn danger" onclick="adminDelete('${kind}',${i})">${t('del')}</button>`;
    return `<tr><td><b>#${i+1}</b></td>${cells.map(c=>`<td>${c}</td>`).join('')}<td style="white-space:nowrap">${ops}</td></tr>`;
  }).join('');
  return `<table><thead><tr>${ths}</tr></thead><tbody>${rows||`<tr><td colspan="7" class="comment-empty">${t('comment_empty')}</td></tr>`}</tbody></table>`;
}
function adminRisk(){
  const risks=LOGS.filter(l=>l.lv!=='INFO');
  const resolved=S.riskResolved||{};
  const rows=risks.map(l=>{const done=resolved[l.m];
    return `<div class="risk-row ${done?'done':''}"><span class="lv-${l.lv}">${l.lv}</span><div style="flex:1"><b>${esc(l.m)}</b><p>${l.t} · ${l.u}</p></div>${done?`<span class="tag green">${t('risk_resolved')}</span>`:`<button class="btn" onclick="resolveRisk('${esc(l.m)}')">${t('risk_handle')}</button>`}</div>`;}).join('')||`<div class="comment-empty">${t('comment_empty')}</div>`;
  const high=risks.filter(l=>l.lv==='ERROR').length;
  return `<div class="kpi-strip"><div class="m"><b>${risks.length}</b><span>${t('admin_risk')}</span></div><div class="m"><b>${high}</b><span>ERROR</span></div></div>
  <div class="card"><div class="card-b">${rows}</div></div>`;
}
function resolveRisk(key){S.riskResolved=S.riskResolved||{};S.riskResolved[key]=true;audit('resolve_risk',key);render();toast(t('risk_resolved'));}
function adminSecurity(){
  const checks=[

  return `<div class="card"><div class="card-h"><h3>${t('sec_check')}</h3></div><div class="card-b">${rows}</div></div>`;

function adminAudit(){
  const rows=AUDIT.length?AUDIT.map(a=>`<tr><td>${esc(a.time)}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td>${esc(a.target||'')}</td><td>${esc(a.detail||'')}</td></tr>`).join(''):`<tr><td colspan="5" class="comment-empty">${t('comment_empty')}</td></tr>`;

function openAdminForm(kind,index){
  const arr=adminArr(kind);const rec=(index!==undefined&&arr[index])?arr[index]:null;
  const fields=ADMIN_FIELDS[kind].map(f=>{
    const v=rec?(rec[f[0]]??''):'';const vs=Array.isArray(v)?v.join(','):v;
    return `<label class="field"><span>${f[1]}</span><input id="af_${f[0]}" value="${esc(vs)}"></label>`;
  }).join('');
  openModal(`<div class="modal-body">
    <h2>${rec?t('edit'):t('add_new')}</h2>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">${fields}</div>
    <div class="btn-row"><button class="btn btn-p" onclick="saveAdminRecord('${kind}',${rec?index:'null'})">${t('save')}</button><button class="btn" onclick="closeModal()">${t('cancel')}</button></div>
  </div>`);
}
async function saveAdminRecord(kind,index){
  const fields=ADMIN_FIELDS[kind];const row={};
  fields.forEach(f=>{const el=document.getElementById('af_'+f[0]);if(el)row[f[0]]=el.value;});
  const arr=adminArr(kind);const isEdit=index!==undefined&&arr[index];
  if(isEdit)Object.assign(arr[index],row);
  else arr.push(normalizeAdminRow(kind,row));
  closeModal();render();
  const label=row.name||row.title||row.n||'';
  if(sbClient){
    const mapped=mapAdminRow(kind,row);
    let res;
    if(isEdit&&arr[index].id)res=await sbClient.from(ADMIN_DB[kind]).update(mapped).eq('id',arr[index].id);
    else res=await sbClient.from(ADMIN_DB[kind]).insert(mapped);
    if(res&&res.error){console.warn(res.error);toast('已本地保存，写库待后台权限生效');}
    else audit(isEdit?'update':'create',kind,label);
  }else audit(isEdit?'update':'create',kind,label);
  toast(t('save'));
}
function normalizeAdminRow(kind,row){
  const base={likes:0,replies:0,views:'0',projects:0,status:'在线'};
  if(kind==='games')return Object.assign({studio:'',genre:[],score:0,downloads:'0',desc:''},row);
  if(kind==='posts')return Object.assign({author:currentUser?currentUser.profile.name:'开发者',role:'dev',cat:row.cat||'general',time:'刚刚',likes:0,replies:0,views:'0',tags:[]},row);
  if(kind==='resources')return Object.assign({v:'1.0.0',size:'-',t:'工具链'},row);
  if(kind==='members')return Object.assign({role:'dev',status:'在线',projects:0},row);
  return Object.assign({on:false,k:'-'},row);
}
function mapAdminRow(kind,row){
  if(kind==='games')return {name:row.name,studio:row.studio,genre:row.genre?row.genre.split(/[,，]/).filter(Boolean):[],score:parseInt(row.score)||0,downloads:String(row.downloads||'0'),description:row.desc};
  if(kind==='posts')return {title:row.title,category:row.cat,body:row.title};
  if(kind==='resources')return {name:row.n,type:row.t,version:row.v,description:row.d,size:row.size};
  if(kind==='members')return {name:row.name,email:row.email,role:row.role,status:row.status};
  return {name:row.n,key_masked:row.k};
}
async function adminDelete(kind,index){
  if(!confirm(t('confirm_del')))return;
  const arr=adminArr(kind);const rec=arr[index];if(!rec)return;
  arr.splice(index,1);render();
  if(sbClient&&rec.id){const {error}=await sbClient.from(ADMIN_DB[kind]).delete().eq('id',rec.id);if(error){console.warn(error);toast('已本地删除，写库待后台权限生效');}}
  audit('delete',kind,rec.name||rec.title||rec.n);toast(t('del'));
}

  if(S.tab==='admin'&&!isAdmin()){S.tab='overview';}
